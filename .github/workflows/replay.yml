name: Replay Holodeck experiments
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify contextual state and retention
        run: |
          python experiments/model-applications/context_quotient.py > "$RUNNER_TEMP/context-quotient.json"
          cmp experiments/model-applications/context_quotient.json "$RUNNER_TEMP/context-quotient.json"
      - name: Replay definition to model, migration and streamed Holo
        run: |
          pilot=experiments/model-applications/vertical
          python "$pilot/replay.py" > "$RUNNER_TEMP/vertical.json"
          cmp "$pilot/evidence.json" "$RUNNER_TEMP/vertical.json"
          python "$pilot/replay.py" --browser "$(command -v google-chrome)" > "$RUNNER_TEMP/vertical-browser.json"
          python -c 'import json, sys; sys.exit(json.load(open(sys.argv[1])).get("chromium_stream") != "passed")' "$RUNNER_TEMP/vertical-browser.json"
      - name: Verify decision quotient and revision-bound plan certificates
        run: |
          foundation=experiments/model-applications/foundation
          python "$foundation/preference_quotient.py" > "$RUNNER_TEMP/preference-quotient.json"
          python "$foundation/certified_replay.py" > "$RUNNER_TEMP/certified-replay.json"
          cmp "$foundation/preference_quotient.json" "$RUNNER_TEMP/preference-quotient.json"
          cmp "$foundation/certified_replay.json" "$RUNNER_TEMP/certified-replay.json"
      - name: Verify objective discovery and honest refusal
        run: |
          elicitation=experiments/model-applications/elicitation
          python "$elicitation/replay.py" > "$RUNNER_TEMP/elicitation.json"
          python "$elicitation/continuous.py" > "$RUNNER_TEMP/continuous-intent.json"
          cmp "$elicitation/evidence.json" "$RUNNER_TEMP/elicitation.json"
          cmp "$elicitation/continuous.json" "$RUNNER_TEMP/continuous-intent.json"
      - name: Check out pinned published planning definitions
        uses: actions/checkout@v4
        with:
          repository: aibasel/downward-benchmarks
          ref: e21d49c2cb61d147a46c5966f2581bf6fd422b9f
          path: pinned-ipc
          persist-credentials: false
          sparse-checkout: |
            gripper
            blocks
            miconic
      - name: Verify shared Deck weights and external formal application replay
        run: |
          structural=experiments/model-applications/structural
          python "$structural/replay.py" --sources pinned-ipc > "$RUNNER_TEMP/structural.json"
          cmp "$structural/evidence.json" "$RUNNER_TEMP/structural.json"
      - name: Verify ambiguity-aware retargeting during durable execution
        run: |
          intent=experiments/model-applications/intent
          python "$intent/verify.py" --sources pinned-ipc > "$RUNNER_TEMP/intent-retarget.json"
          cmp "$intent/evidence.json" "$RUNNER_TEMP/intent-retarget.json"
          python "$intent/scope_eval.py" > "$RUNNER_TEMP/scope-grounding.json"
          cmp "$intent/scope_evidence.json" "$RUNNER_TEMP/scope-grounding.json"
      - name: Replay finite causal state discovery
        run: node experiments/causal-discovery/replay.mjs
      - run: python -m pip install -r requirements.txt
      - run: python experiments/shopware/replay.py
      - name: Reproduce masked quantity policies
        run: |
          python -m pip install "mlx[cpu]==0.32.4"
          data=experiments/shopware/evidence/hidden-quantity
          checkpoint=experiments/shopware/evidence/joint-deck/checkpoint
          python experiments/shopware/benchmark/hidden_quantity_evaluate.py "$data" "$checkpoint" "$RUNNER_TEMP/hidden-quantity"
          cmp "$data/summary.json" "$RUNNER_TEMP/hidden-quantity/report.json"
      - name: Reproduce shipping rule acquisition and checkout
        run: |
          data=experiments/shopware/evidence/shipping-rules
          checkpoint=experiments/shopware/evidence/joint-deck/checkpoint
          python experiments/shopware/benchmark/shipping_evaluate.py "$data" "$checkpoint" "$RUNNER_TEMP/shipping-rules"
          cmp "$data/summary.json" "$RUNNER_TEMP/shipping-rules/report.json"
      - run: PYTHONPATH=src python -m unittest discover -s tests
