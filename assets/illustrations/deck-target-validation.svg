<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="416" viewBox="0 0 1120 416" role="img" aria-labelledby="title desc">
  <title id="title">Evidence and the next independent tests</title>
  <desc id="desc">Measured formal compilation and bounded English retargeting precede independent definition qualification and a causal test of learned model integration against matched baselines.</desc>
  <defs><style>
    .title{font:700 34px 'Helvetica Neue',Arial,sans-serif;fill:#112945}
    .label{font:700 14px 'Helvetica Neue',Arial,sans-serif;letter-spacing:1.6px;fill:#205945}
    .pending{fill:#514779}
    .name{font:700 20px 'Helvetica Neue',Arial,sans-serif;fill:#112945}
    .copy{font:17px 'Helvetica Neue',Arial,sans-serif;fill:#36536e}
  </style></defs>
  <rect width="1120" height="416" rx="22" fill="#eef3f9"/>
  <text x="40" y="55" class="title">Evidence and the next independent tests</text>
  <rect x="40" y="92" width="505" height="245" rx="16" fill="#e5f2ed" stroke="#8aaf9f"/>
  <rect x="575" y="92" width="505" height="245" rx="16" fill="#faf7ff" stroke="#b9add2" stroke-dasharray="6 5"/>
  <text x="64" y="125" class="label">REPRODUCED IN THE DECLARED SCOPE</text>
  <text x="64" y="166" class="name">Compile and execute formal definitions</text>
  <text x="64" y="193" class="copy">Seven published tasks, one shared execution path</text>
  <path d="M64 220h457" stroke="#b0cdc2"/>
  <text x="64" y="257" class="name">Replan from a bounded English request</text>
  <text x="64" y="284" class="copy">Commit a common optimum or ask about scope</text>
  <text x="599" y="125" class="label pending">RESEARCH GATES</text>
  <text x="599" y="166" class="name">Qualify independent application definitions</text>
  <text x="599" y="193" class="copy">Withhold intent, rules and application families</text>
  <path d="M599 220h457" stroke="#d5cbe5"/>
  <text x="599" y="257" class="name">Measure the model’s causal contribution</text>
  <text x="599" y="284" class="copy">Match tool access, knowledge and verification cost</text>
  <text x="40" y="375" class="copy">Track false qualification, exact coverage, reuse and performance on independently authored evidence.</text>
</svg>
