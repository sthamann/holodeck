<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="580" viewBox="0 0 1120 580" role="img" aria-labelledby="title desc">
  <title id="title">Holodeck from definition to durable effects</title>
  <desc id="desc">Formal definitions compile into a versioned Deck. Typed requests use scope-aware planning and validated actions. The generic Host commits named effects and receipts. A foundation model is the proposed broader interface.</desc>
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#42628a"/></marker>
    <style>
      .title{font:700 38px 'Helvetica Neue',Arial,sans-serif;fill:#112945}.sub{font:19px 'Helvetica Neue',Arial,sans-serif;fill:#3e5871}
      .label{font:700 13px 'Helvetica Neue',Arial,sans-serif;letter-spacing:1.8px;fill:#16644e}
      .name{font:700 24px 'Helvetica Neue',Arial,sans-serif;fill:#112945}.body{font:17px 'Helvetica Neue',Arial,sans-serif;fill:#334f68}
      .edge{stroke:#42628a;stroke-width:2.4;fill:none;marker-end:url(#head)}
    </style>
  </defs>
  <rect width="1120" height="580" rx="22" fill="#eef3f9"/>
  <text x="38" y="62" class="title">From definition to durable effects</text>
  <text x="40" y="97" class="sub">Executable rules in the Deck, concrete identities in the Host.</text>
  <g stroke="#bac9d8" stroke-width="1.5">
    <rect x="40" y="134" width="230" height="135" rx="15" fill="#fff"/>
    <rect x="310" y="134" width="228" height="135" rx="15" fill="#fff"/>
    <rect x="578" y="134" width="230" height="135" rx="15" fill="#e5f2ed" stroke="#86b19f"/>
    <rect x="848" y="134" width="232" height="135" rx="15" fill="#fff"/>
    <rect x="40" y="325" width="498" height="111" rx="15" fill="#fff"/>
    <rect x="578" y="325" width="502" height="111" rx="15" fill="#fff"/>
    <rect x="40" y="477" width="1040" height="65" rx="13" fill="none" stroke="#7f99b4" stroke-dasharray="6 5"/>
  </g>
  <path class="edge" d="M273 201h32 M541 201h32 M811 201h32"/>
  <path class="edge" d="M389 325v-30h307v-21 M963 271v49"/>
  <text x="58" y="175" class="name">Definition</text><text x="58" y="211" class="body">Objects and rules</text><text x="58" y="235" class="body">Actions and effects</text>
  <text x="328" y="175" class="name">Compiler</text><text x="328" y="211" class="body">Typed data bindings</text><text x="328" y="235" class="body">Shared exact weights</text>
  <text x="596" y="175" class="name">Versioned Deck</text><text x="596" y="211" class="body">Executable rules</text><text x="596" y="235" class="body">Planning and validation</text>
  <text x="866" y="175" class="name">Generic Host</text><text x="866" y="211" class="body">Versioned storage</text><text x="866" y="235" class="body">Atomic commit</text>
  <text x="58" y="365" class="name">Requests and controls</text><text x="58" y="400" class="body">Typed intent from streamed Holos, APIs or agents</text>
  <text x="596" y="365" class="name">Durable result</text><text x="596" y="400" class="body">Named objects, ordered effects and receipts</text>
  <text x="58" y="517" class="label">RESEARCH TARGET</text><text x="248" y="517" class="body">Shared foundation model for broader intent, reasoning and interface composition</text>
</svg>
