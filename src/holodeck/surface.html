<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Holoshop</title>
<style>
:root{color-scheme:light;--paper:#f5f2e8;--white:#fffdf7;--ink:#202b26;--muted:#566459;--line:#d6d9cc;--accent:#294e3e;--hover:#173d2e;--soft:#e8eee4;--hero:#dee8d9;--danger:#a52f25;font:16px/1.5 system-ui,sans-serif;color:var(--ink);background:var(--paper);accent-color:var(--accent)}
:root[data-theme=werkraum]{--paper:#edf1f6;--white:#fff;--ink:#142639;--muted:#415b70;--line:#ced8e4;--accent:#214b70;--hover:#153552;--soft:#e5eef8;--hero:#dce8f4}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0}
::selection{background:var(--hero);color:var(--ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
a{color:var(--accent);text-underline-offset:.22em}
header,footer{border-color:var(--line);border-style:solid;border-width:0}
header{border-bottom-width:1px}
footer{border-top-width:1px;padding:19px 0;color:var(--muted);font-size:.89rem}
.wrap{width:min(1160px,calc(100% - 48px));margin:auto}
.bar{min-height:72px;display:flex;align-items:center;justify-content:space-between;gap:18px}
.brand{font:700 1.65rem Georgia,serif;color:var(--ink);text-decoration:none}
[data-theme=werkraum] .brand,[data-theme=werkraum] h1,[data-theme=werkraum] .hero h2{font-family:system-ui,sans-serif}
nav,.links,.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
nav a,.links a{padding:8px 12px;border-radius:6px;text-decoration:none;font-size:.91rem}
[aria-current=page]{background:var(--soft);font-weight:700}
main{padding:32px 0 64px}
h1,h2,h3,p,dl,dd{margin:0}
h1,.hero h2{font:700 clamp(2.4rem,6vw,4.8rem)/1.05 Georgia,serif;letter-spacing:-.03em}
h1{font-size:clamp(2.3rem,5vw,3.5rem);margin-bottom:23px}
h2{font-size:1.32rem;line-height:1.23;margin-bottom:13px}
h3{font-size:1.05rem}
p{max-width:66ch}
.hero{background:var(--hero);border-radius:15px;padding:clamp(24px,6vw,62px)}
.hero p{margin-top:13px;color:var(--muted);font-size:1.09rem}
.stack,.split{display:grid;align-items:start;gap:22px;min-width:0}
.split{grid-template-columns:minmax(0,1fr) minmax(250px,.54fr)}
.panel{border:1px solid var(--line);border-radius:14px;background:var(--white);padding:19px;min-width:0}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,235px),1fr));gap:16px}
.card{display:flex;flex-direction:column;overflow:hidden;background:var(--white);border:1px solid var(--line);border-radius:14px}
.card img{width:100%;height:210px;object-fit:contain;background:var(--soft);padding:14px}
.card-body{padding:16px;display:grid;gap:6px;flex:1}
.card-body .actions{margin-top:auto;padding-top:8px}
.money{font-weight:680;font-variant-numeric:tabular-nums}
.subtle,.meta{color:var(--muted)}
.list-row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding:12px 0}
.list-row:first-child{border-top:0}
.list-row:last-child{padding-bottom:0}
.values{display:grid;gap:7px}
.values>div{display:flex;align-items:baseline;gap:10px}
.values dt{color:var(--muted);font-size:.85rem}
.values dd{min-width:0;overflow-wrap:anywhere}
.stats{background:var(--soft);border-radius:14px;padding:21px}
.stats .values>div{justify-content:space-between}
.stats .values>div:last-child{border-top:1px solid var(--line);padding-top:9px;margin-top:4px}
.metrics-strip{display:flex;gap:14px;flex-wrap:wrap}
.metrics-strip>div{flex:1 0 125px;display:grid;gap:4px;padding:3px 8px}
.metrics-strip dd{font-size:1.6rem;font-weight:680}
.tools{display:flex;align-items:end;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.tools>label{min-width:min(100%,130px);max-width:100%}
.tools>label:first-child:has(input){min-width:min(100%,235px)}
.table-box{overflow:auto;max-width:100%;border-top:1px solid var(--line)}
table{width:100%;border-collapse:collapse;text-align:left;font-size:.91rem}
th,td{padding:10px 11px;border-bottom:1px solid var(--line);vertical-align:middle}
th{white-space:nowrap;color:var(--muted)}
th button{font-size:inherit;min-height:36px;padding:4px 8px}
td{max-width:280px;overflow-wrap:anywhere}
td img{display:block;width:60px;height:50px;object-fit:contain;border-radius:6px;background:var(--soft)}
td:last-child{min-width:100px}
.expanded{background:var(--soft)}
.expanded>td{padding:15px}
.expanded .actions{margin-top:13px}
form{display:grid;gap:10px;justify-items:start}
.fields{display:grid;gap:9px;width:min(100%,540px)}
.actions form{display:flex;align-items:end;gap:8px;flex-wrap:wrap}
.actions .fields{width:auto}
label{display:grid;gap:4px;font-size:.86rem;font-weight:650}
input,select,textarea,button{font:inherit}
input,select,textarea{width:100%;min-width:0;min-height:40px;padding:7px 10px;border:1px solid #91a39c;border-radius:6px;background:var(--white);color:var(--ink)}
input[type=number]{width:90px}
.check{display:flex;align-items:center;gap:8px}
.check input{width:18px;height:18px;min-height:0;flex:none}
button,.button-link{display:inline-flex;align-items:center;min-height:39px;padding:8px 12px;border:1px solid transparent;border-radius:7px;color:white;background:var(--accent);font-size:.89rem;font-weight:650;line-height:1.2;text-decoration:none;cursor:pointer}
button:hover,.button-link:hover{background:var(--hover)}
button:disabled{opacity:.57;cursor:wait}
button.secondary,.links a{border:1px solid var(--line);background:var(--white);color:var(--accent)}
button.secondary:hover,.links a:hover,.links a[aria-current=page]{background:var(--soft)}
.links:not(:first-child){margin-top:12px}
.tag{display:inline-block;padding:3px 7px;border-radius:5px;background:var(--soft);color:var(--accent);white-space:nowrap}
.notice{padding:10px 13px;background:var(--soft);border:1px solid var(--line);border-radius:8px;margin-bottom:16px}
.error{color:var(--danger)}
.empty{padding:16px 0;color:var(--muted)}
.composer{padding:16px 18px;margin-bottom:22px;border:1px solid var(--line);border-radius:14px;background:var(--white)}
.composer h2{margin-bottom:6px}
.composer form,.composer label{width:100%}
.composer textarea{resize:vertical;min-height:74px}
.criteria{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 13px}
.criteria .tag{white-space:normal}
@media(max-width:760px){.wrap{width:calc(100% - 32px)}.bar{align-items:flex-start;flex-direction:column;gap:4px;padding:12px 0}nav a{padding:6px 8px}main{padding-top:23px}.split{grid-template-columns:1fr}.stack,.split{gap:16px}.panel{padding:15px}}
@media(max-width:440px){.card{display:grid;grid-template-columns:105px minmax(0,1fr)}.card img{height:100%;padding:5px}.card-body{padding:12px}.table-box{margin-inline:-6px}.hero{padding:25px 17px}}
</style>
</head>
<body>
<header><div class="wrap bar"><a class="brand" href="?task=storefront">Holoshop</a><nav aria-label="Shopbereiche"></nav></div></header>
<main class="wrap"><h1 id="title">Holoshop</h1><p id="notice" class="notice" role="status" hidden></p><div id="composer" hidden></div><div id="surface"></div></main>
<footer><div class="wrap">Lokaler Testshop · Simulierte Zahlungen</div></footer>
<script type="module" src="/surface.js"></script>
</body>
</html>
